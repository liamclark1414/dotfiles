# ~/.config/kitty/kitty.conf
# Theme: The Shire — cozy Middle-earth
# Reload inside kitty with ctrl+shift+F5
# NOTE: kitty comments must be on their own line (no trailing comments)

# ─── Fonts ───────────────────────────────────────────────
font_family      IosevkaTermSlab Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ─── Window ──────────────────────────────────────────────
# breathing room around the text
window_padding_width    12
# slight see-through (only visible under a compositor like Hyprland)
background_opacity      0.95
# close without an "are you sure?" prompt
confirm_os_window_close 0
# no title bar; Hyprland will draw borders instead
hide_window_decorations yes
# start at a fixed size, measured in character cells ('c')
remember_window_size    no
initial_window_width    100c
initial_window_height   30c

# ─── Cursor ──────────────────────────────────────────────
cursor_shape           beam
cursor_blink_interval  0.6
# little comet-tail when the cursor jumps
cursor_trail           3

# ─── Behavior ────────────────────────────────────────────
scrollback_lines       10000
enable_audio_bell      no
# selecting text copies it automatically
copy_on_select         yes
url_style              curly

# ─── Tabs ────────────────────────────────────────────────
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted

# ─── Colors: The Shire palette ───────────────────────────
# parchment on forest-at-night
foreground             #e8dcc0
background             #1e2219
# highlighted text: hearth amber
selection_foreground   #1e2219
selection_background   #d9a24e
# cursor: the One Ring
cursor                 #e0c36a
cursor_text_color      #1e2219
# links: Brandywine river
url_color              #7a9bad

active_tab_foreground   #1e2219
active_tab_background   #8fa86b
inactive_tab_foreground #9c7a54
inactive_tab_background #2b3024
tab_bar_background      #1e2219

active_border_color     #d9a24e
inactive_border_color   #2b3024

# ─── The 16 ANSI colors ──────────────────────────────────
# Programs pick from these slots. Each pair below is a
# normal color (0-7) followed by its bright twin (8-15).

# black: mossy stone / weathered stone (comments, dim text)
color0   #2b3024
color8   #4a5240

# red: autumn leaf
color1   #c0634f
color9   #d67a64

# green: Shire hills
color2   #8fa86b
color10  #a8c084

# yellow: hearth fire / the One Ring
color3   #d9a24e
color11  #e0c36a

# blue: Brandywine river
color4   #7a9bad
color12  #94b4c4

# magenta: heather on the downs
color5   #a87a8f
color13  #c094a8

# cyan: Rivendell waters
color6   #7aa89a
color14  #94c0b2

# white: parchment / elven light
color7   #e8dcc0
color15  #f5ecd6
