# ~/.config/hypr/hyprlock.conf — the lock screen: "Speak, friend, and enter"
# Colours + wallpaper follow the current place (hyprlock-place.conf is written
# by scripts/workspace-theme.sh).
source = ~/.config/hypr/hyprlock-place.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.2
}

# the time, large and gold
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb($gold)
    font_size = 96
    font_family = IosevkaTermSlab Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# the date, in the Shire's manner
label {
    monitor =
    text = cmd[update:60000] date +"%A, the %-d of %B"
    color = rgb($text)
    font_size = 20
    font_family = IosevkaTermSlab Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# the place you left your desk in
label {
    monitor =
    text = $placename
    color = rgb($accent)
    font_size = 14
    font_family = IosevkaTermSlab Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 3
    rounding = 14
    outer_color = rgb($gold)
    inner_color = rgba($bg_glass)
    font_color = rgb($text)
    check_color = rgb($accent)
    fail_color = rgb($red)
    dots_size = 0.25
    dots_spacing = 0.35
    fade_on_empty = false
    placeholder_text = <i>Speak, friend, and enter…</i>
    fail_text = <b>You shall not pass!</b>
    fail_timeout = 2000
    position = 0, -60
    halign = center
    valign = center
}

# a line of lore at the bottom
label {
    monitor =
    text = Not all those who wander are lost.
    color = rgb($muted)
    font_size = 12
    font_family = IosevkaTermSlab Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
