# ~/.config/hypr/hyprland.conf
# Theme: The Shire — cozy Middle-earth (matches kitty.conf)
# Hyprland reloads this file automatically on save.

# ─── Palette ─────────────────────────────────────────────
# Same hex codes as kitty. Hyprland colors are rgb(RRGGBB) or rgba(RRGGBBAA).
$forest     = 1e2219
$moss       = 2b3024
$stone      = 4a5240
$parchment  = e8dcc0
$hearth     = d9a24e
$ring       = e0c36a
$hills      = 8fa86b
$brandywine = 7a9bad

# ─── Programs ────────────────────────────────────────────
$terminal    = kitty
$fileManager = nautilus
# Rofi app launcher, themed per place (rofi/shire.rasi)
$menu        = rofi -show drun

# ─── Monitors ────────────────────────────────────────────
# auto-detect everything at preferred resolution
monitor = , preferred, auto, 1

# ─── Autostart ───────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/session-look.sh hyprland
exec-once = hyprctl setcursor Bibata-Modern-Gold 24
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/workspace-theme.sh

# ─── Environment ─────────────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Gold
# where to find cursor themes (the gold one lives in ~/.local/share/icons)
env = XCURSOR_PATH,/home/liam-clark/.local/share/icons:/home/liam-clark/.icons:/usr/share/icons
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── Layout & borders ────────────────────────────────────
general {
    # room to breathe, like a hobbit-hole garden
    gaps_in  = 6
    gaps_out = 14
    border_size = 3

    # active: hearth fire glowing into the Shire hills
    col.active_border   = rgb($hearth) rgb($ring) rgb($hills) 45deg
    # inactive: mossy stone
    col.inactive_border = rgb($moss)

    resize_on_border = true
    layout = dwindle
}

# ─── Decoration ──────────────────────────────────────────
decoration {
    # round doors, round windows
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.92

    # soft lamplight shadow
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(1e2219ee)
        color_inactive = rgba(1e221988)
    }

    # frosted glass (makes kitty's 0.95 opacity look lovely)
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }

    # unfocused windows sink slightly into the dusk
    dim_inactive = true
    dim_strength = 0.08
}

# ─── Animations ──────────────────────────────────────────
# The Shire is never in a hurry: slow, gentle ease-outs.
animations {
    enabled = true

    bezier = amble,  0.25, 0.9, 0.3, 1.0
    bezier = settle, 0.34, 1.3, 0.64, 1.0

    animation = windows,     1, 5, settle, popin 85%
    animation = windowsOut,  1, 4, amble,  popin 85%
    animation = border,      1, 8, amble
    animation = borderangle, 1, 60, amble, loop
    animation = fade,        1, 5, amble
    animation = workspaces,  1, 6, amble, slidefade 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    # hide the default anime wallpaper and logo
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # forest background behind everything until a wallpaper is set
    background_color = rgb($forest)
}

# ─── Input ───────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ─── Keybinds ────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
# lock the screen ("Speak, friend, and enter")
bind = $mod, Escape, exec, loginctl lock-session
bind = $mod, E, exec, $fileManager
bind = $mod, Space, exec, $menu
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

# move focus (arrows and vim keys)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u

# workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# drag / resize windows with mod + mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# volume & brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
